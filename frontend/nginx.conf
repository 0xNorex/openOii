server {
    listen 15173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Text assets compress ~3-4x; woff2/images are already compressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Vite emits content-hashed filenames under /assets: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # public/ files keep stable names (fonts, logos, favicon): cache, then revalidate.
    location ~* ^/(fonts|brand|provider-logos)/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # The SPA shell must always be revalidated so new deploys are picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
