<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="openOii">
  <!-- 方向 C：「O」双版错位，16px 像素网格对齐 -->
  <style>
    svg { --bg: #F7F7F4; --key: #2F4BC3; --cyan: oklch(0.55 0.14 180); --blend: multiply }
    @media (prefers-color-scheme: dark) { svg { --bg: #0F1018; --key: #96ACFE; --cyan: oklch(0.6 0.12 195); --blend: screen } }
  </style>
  <rect width="16" height="16" rx="3" fill="var(--bg)"/>
  <circle cx="8.6" cy="8.6" r="4.6" fill="none" stroke="var(--cyan)" stroke-width="2.4"/>
  <circle cx="7.4" cy="7.4" r="4.6" fill="none" stroke="var(--key)" stroke-width="2.4" style="mix-blend-mode:var(--blend)"/>
</svg>
